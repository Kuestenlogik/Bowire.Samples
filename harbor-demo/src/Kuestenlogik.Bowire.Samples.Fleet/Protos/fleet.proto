syntax = "proto3";

option csharp_namespace = "Harbor.Fleet.V1";
package harbor.fleet.v1;

// Fleet — the vessel registry / master-data service. Authoritative source
// of ShipId; other harbor services reference ships by that id and look
// them up here. Contract-first .proto because this reference data is
// small, hot, strongly typed and must not drift.
service Fleet {
  // Current record for one vessel.
  rpc GetShip(GetShipRequest) returns (Ship);
  // Bulk fleet sync — every vessel, server-streamed.
  rpc ListShips(ListShipsRequest) returns (stream Ship);
}

message GetShipRequest {
  int32 id = 1;
}

message ListShipsRequest {}

enum ShipType {
  SHIP_TYPE_UNSPECIFIED = 0;
  CONTAINER = 1;
  BULK = 2;
  TANKER = 3;
}

message Ship {
  int32 id = 1;
  string name = 2;
  string flag = 3;
  int32 length_meters = 4;
  ShipType type = 5;
}
